
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Slots</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #170d29, #48216b);
            color: white;
        }

        .container {
            text-align: center;
            background: #241438;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            width: 350px;
        }

        h1 {
            color: #ffd65a;
            font-size: 32px;
            margin-bottom: 30px;
        }

        .slots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .reel {
            width: 90px;
            height: 100px;
            background: white;
            border-radius: 12px;
            color: black;
            font-size: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #d9a43e;
        }

        button {
            background: linear-gradient(#ffe77c, #e99a19);
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            color: #351b05;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #result {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 22px;
        }

        .stats {
            margin-top: 25px;
            color: #ccc;
        }

        .rolling {
            animation: shake 0.1s infinite alternate;
        }

        @keyframes shake {
            from { transform: translateY(-3px); }
            to { transform: translateY(3px); }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>LUCKY SLOTS</h1>

        <div class="slots">
            <div class="reel">🍒</div>
            <div class="reel">🍋</div>
            <div class="reel">💎</div>
        </div>

        <div id="result">Попробуй свою удачу!</div>

        <button id="spinButton" onclick="spin()">
            🎰 КРУТИТЬ
        </button>

        <div class="stats">
            Спинов: <span id="spins">0</span>
            <br><br>
            Выигрышей: <span id="wins">0</span>
        </div>

    </div>

    <script>
        const symbols = [
            "🍒", "🍋", "🍊", "🍇",
            "🍉", "⭐", "💎", "7️⃣"
        ];

        const reels = document.querySelectorAll(".reel");

        let spins = 0;
        let wins = 0;
        let isSpinning = false;

        function spin() {

            if (isSpinning) return;

            isSpinning = true;

            const button = document.getElementById("spinButton");
            const result = document.getElementById("result");

            button.disabled = true;
            result.textContent = "Барабаны крутятся...";

            spins++;
            document.getElementById("spins").textContent = spins;

            const finalSymbols = reels.length
                ? Array.from(reels, () =>
                    symbols[Math.floor(Math.random() * symbols.length)]
                  )
                : [];

            reels.forEach((reel, index) => {

                reel.classList.add("rolling");

                let counter = 0;

                const interval = setInterval(() => {

                    reel.textContent =
                        symbols[Math.floor(Math.random() * symbols.length)];

                    counter++;

                    if (counter >= 15 + index * 7) {

                        clearInterval(interval);

                        reel.textContent = finalSymbols[index];
                        reel.classList.remove("rolling");

                        if (index === reels.length - 1) {
                            finishSpin(finalSymbols);
                        }
                    }

                }, 100);

            });
        }

        function finishSpin(finalSymbols) {

            const result = document.getElementById("result");
            const button = document.getElementById("spinButton");

            if (finalSymbols.every(symbol =>
                symbol === finalSymbols[0])) {

                wins++;

                document.getElementById("wins").textContent = wins;

                result.textContent = "🎉 ДЖЕКПОТ! ТРИ ОДИНАКОВЫХ!";

            } else if (new Set(finalSymbols).size === 2) {

                result.textContent = "✨ Почти получилось!";

            } else {

                result.textContent = "Не повезло! Попробуй ещё.";

            }

            isSpinning = false;
            button.disabled = false;
        }

    </script>

</body>
</html>
